<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040b1a"/>
      <stop offset="55%" stop-color="#0b1f3f"/>
      <stop offset="100%" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="icePerspective" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Rounded Arcade Tile Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="6"/>

  <!-- 35-Degree Broadcast Ice Sheet Trapezoid -->
  <polygon points="128,164 384,164 468,424 44,424" fill="url(#icePerspective)"/>
  <line x1="98" y1="256" x2="414" y2="256" stroke="#2563eb" stroke-opacity="0.6" stroke-width="8"/>
  <line x1="72" y1="336" x2="440" y2="336" stroke="#dc2626" stroke-opacity="0.65" stroke-width="9"/>

  <!-- Glowing Emerald On-Ice Lead Ring -->
  <ellipse cx="256" cy="346" rx="116" ry="42" fill="#10b981" fill-opacity="0.26" stroke="#34d399" stroke-width="11"/>
  <ellipse cx="256" cy="346" rx="64" ry="22" fill="none" stroke="#a7f3d0" stroke-width="6"/>

  <!-- Hockey Stick Shaft & Taped Blade -->
  <path d="M132,96 L248,324 L374,316 L378,348 L228,358 L104,112 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>
  <rect x="306" y="318" width="54" height="31" rx="4" transform="rotate(-3 333 333)" fill="#38bdf8"/>

  <!-- 3D Hockey Puck -->
  <ellipse cx="268" cy="356" rx="46" ry="20" fill="#020617"/>
  <rect x="222" y="340" width="92" height="16" fill="#0f172a"/>
  <ellipse cx="268" cy="340" rx="46" ry="19" fill="#1e293b" stroke="#fde047" stroke-width="5"/>

  <!-- Synapz Rush Lightning Crest -->
  <polygon points="304,84 236,192 286,192 252,278 358,162 302,162" fill="url(#boltGrad)" stroke="#040b1a" stroke-width="6" stroke-linejoin="round"/>

  <!-- Title Ribbon -->
  <text x="256" y="468" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" letter-spacing="3">HOCKEY RUSH</text>
</svg>
